services:
  - type: web
    name: sp500-tracker-api
    env: python
    region: oregon
    plan: free
    rootDir: sp500-tracker/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
